<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReHaTo – Reflektieren · Gewohnheiten · To-dos</title>
  <meta name="description" content="ReHaTo: Reflektiere deinen Tag, baue Gewohnheiten auf und behalte deine To-dos im Blick.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf9f5">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161815">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div id="backdrop" class="backdrop hidden"></div>

  <aside id="sidebar" class="sidebar">
    <div class="sb-brand">
      <svg class="logo" viewBox="0 0 512 512" aria-hidden="true">
        <rect width="512" height="512" rx="118" fill="url(#g)"/>
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#5d8f6e"/><stop offset="1" stop-color="#41715a"/>
          </linearGradient>
        </defs>
        <path d="M256 408 V232" stroke="#fff" stroke-width="34" stroke-linecap="round"/>
        <path d="M256 252 C186 252 140 210 134 138 C210 142 252 186 256 252 Z" fill="#fff"/>
        <path d="M256 252 C326 252 372 210 378 138 C302 142 260 186 256 252 Z" fill="#fff" opacity=".82"/>
      </svg>
      <div class="brand-text">
        <span class="wordmark">ReHaTo</span>
        <span class="tagline" data-i18n="app.tagline"></span>
      </div>
    </div>

    <nav class="sb-nav">
      <a href="#calendar" class="nav-item" data-view="calendar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="14.5" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>
        <span data-i18n="nav.calendar"></span>
      </a>
      <a href="#habits" class="nav-item" data-view="habits">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v-7"/><path d="M12 13c0-4-2.5-6.5-7-7 .5 4.5 3 7 7 7Z"/><path d="M12 13c0-4 2.5-6.5 7-7-.5 4.5-3 7-7 7Z"/></svg>
        <span data-i18n="nav.habits"></span>
      </a>

      <div class="sb-section" data-i18n="nav.notesGroup"></div>
      <a href="#todos" class="nav-item sub" data-view="todos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="3"/><path d="m8.7 12.3 2.3 2.3 4.5-4.8"/></svg>
        <span data-i18n="nav.todos"></span>
        <span id="todo-badge" class="badge hidden"></span>
      </a>
      <a href="#thoughts" class="nav-item sub" data-view="thoughts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5c4.7 0 8 2.9 8 6.5s-3.3 6.5-8 6.5c-.9 0-1.8-.1-2.6-.3L5.5 19l1-3.1C5 14.7 4 13.1 4 11c0-3.6 3.3-6.5 8-6.5Z"/></svg>
        <span data-i18n="nav.thoughts"></span>
      </a>

      <div class="sb-section" data-i18n="nav.books"></div>
      <a href="#books" class="nav-item sub" data-view="books">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h4.5A2.5 2.5 0 0 1 12 7v13a2.5 2.5 0 0 0-2.5-2.5H5Z"/><path d="M19 4.5h-4.5A2.5 2.5 0 0 0 12 7v13a2.5 2.5 0 0 1 2.5-2.5H19Z"/></svg>
        <span data-i18n="nav.books"></span>
      </a>
      <a href="#quotes" class="nav-item sub" data-view="quotes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 7.5c-2.6.6-4.3 2.5-4.3 5.2v3.8h4.6v-4.6H7.2c0-1.6 1-2.8 2.6-3.2Z"/><path d="M19 7.5c-2.6.6-4.3 2.5-4.3 5.2v3.8h4.6v-4.6h-2.6c0-1.6 1-2.8 2.6-3.2Z"/></svg>
        <span data-i18n="nav.quotes"></span>
      </a>
    </nav>

    <div class="sb-bottom">
      <button id="sb-account" class="nav-item acct-btn hidden">
        <span class="acct-btn-ico"></span>
        <span class="acct-btn-avatar hidden"></span>
        <span id="sb-account-label" class="sb-account-label"></span>
        <span class="acct-btn-badge hidden"></span>
      </button>
      <a href="#info" class="nav-item" data-view="info">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>
        <span data-i18n="nav.info"></span>
      </a>
      <span class="sb-version" id="version"></span>
    </div>
  </aside>

  <div class="content">
    <header class="app-header">
      <button id="sb-toggle" class="icon-btn sb-toggle-btn" data-i18n-title="sb.toggle" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="brand header-brand">
        <span class="wordmark">ReHaTo</span>
      </div>
      <div class="header-actions">
        <button id="lang-toggle" class="chip" data-i18n-title="lang.label">EN</button>
        <button id="theme-toggle" class="chip" data-i18n-title="theme.label">🌙</button>
      </div>
    </header>

    <main id="main">
      <div id="demo-banner" class="demo-banner hidden">
        <span data-i18n="demo.banner"></span> <a href="./" data-i18n="demo.exit"></a>
      </div>
      <section id="view-calendar" class="view"></section>
      <section id="view-habits" class="view hidden"></section>
      <section id="view-todos" class="view hidden"></section>
      <section id="view-thoughts" class="view hidden"></section>
      <section id="view-books" class="view hidden"></section>
      <section id="view-quotes" class="view hidden"></section>
      <section id="view-info" class="view hidden"></section>
    </main>

    <footer class="app-footer">
      <span id="footer-status"></span>
      <span>·</span>
      <a href="https://github.com/Johncrtz/ReHaTo" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </div>

  <!-- Day note editor -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="dialog">
      <div class="dialog-head">
        <h2 class="modal-date"></h2>
        <span class="saved-chip" data-i18n="modal.saved"></span>
      </div>
      <div class="mood-block">
        <span class="mood-label" data-i18n="modal.mood"></span>
        <div class="mood-row"></div>
      </div>
      <textarea id="note-text" rows="8" data-i18n-placeholder="modal.placeholder"></textarea>
      <div class="dialog-foot">
        <button class="btn-ghost danger hidden" data-delete-note data-i18n="modal.delete"></button>
        <button class="btn" data-close data-i18n="modal.close"></button>
      </div>
    </div>
  </div>

  <!-- Account & sync panel -->
  <div id="account-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="dialog dialog-narrow">
      <div id="account-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
